name: Android APK (MCPE 0.8.1 Infdev)

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout modified MCPE source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'cmake;3.22.1' \
            'ndk;16.1.4479499'
          yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare Android wrapper
        run: |
          git clone --depth 1 https://github.com/oldminecraftcommunity/MCPE-0.8.1-Android.git android-wrapper
          rm -rf android-wrapper/app/src/main/cpp
          mkdir -p android-wrapper/app/src/main/cpp
          rsync -a --exclude='.git/' ./ android-wrapper/app/src/main/cpp/

      - name: Check proprietary game resources
        run: |
          test -d android-res || { echo 'Missing android-res/. Extract res/ from your own MCPE 0.8.1 APK and place it here.'; exit 1; }
          test -d android-assets || { echo 'Missing android-assets/. Extract assets/ from your own MCPE 0.8.1 APK and place it here.'; exit 1; }
          test -f tools/original/libminecraftpe.so || { echo 'Missing tools/original/libminecraftpe.so. Put your own original ARMv7 MCPE 0.8.1 libminecraftpe.so there so the sound extractor can generate pcm_data.c.'; exit 1; }

          # Generate the embedded sound table from the ORIGINAL 0.8.1 ARMv7 library.
          rm -f minecraftpe/impl/pcm_data.c
          python3 tools/get_sound_data.py tools/original/libminecraftpe.so
          mv pcm_data.c minecraftpe/impl/pcm_data.c

          rm -rf android-wrapper/app/src/main/res android-wrapper/app/src/main/assets
          cp -a android-res android-wrapper/app/src/main/res
          cp -a android-assets android-wrapper/app/src/main/assets

      - name: Build release APK
        working-directory: android-wrapper
        run: ./gradlew --no-daemon assembleRelease

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: mcpe-0.8.1-infdev-apk
          path: android-wrapper/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
