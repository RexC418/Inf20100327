name: Infdev 20100327 parity

on:
  push:
    branches:
      - native-mcpe-infdev
    paths:
      - "minecraftpe/headers/util/InfdevJavaRandom.hpp"
      - "minecraftpe/headers/util/InfdevNoisePerlin.hpp"
      - "minecraftpe/headers/util/InfdevNoiseOctaves.hpp"
      - "minecraftpe/impl/util/InfdevJavaRandom.cpp"
      - "minecraftpe/impl/util/InfdevNoisePerlin.cpp"
      - "minecraftpe/impl/util/InfdevNoiseOctaves.cpp"
      - "minecraftpe/headers/level/gen/RandomLevelSource.hpp"
      - "minecraftpe/impl/level/gen/RandomLevelSource.cpp"
      - "tests/infdev-parity/**"
      - ".github/workflows/infdev-parity.yml"
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"

      - name: Fetch original Infdev 20100327 jar
        run: |
          mkdir -p tests/infdev-parity/reference
          curl -fL --retry 3 --retry-delay 2 \
            -o tests/infdev-parity/reference/inf-20100327.jar \
            https://files.betacraft.uk/launcher/assets/versions/inf-20100327.jar
          expected="c696d187821b9034046e4572dfdb579a60b80530ff02598aadb6322e8ad8b247"
          actual="$(sha256sum tests/infdev-parity/reference/inf-20100327.jar | cut -d' ' -f1)"
          echo "Infdev 20100327 jar SHA-256: $actual"
          test "$actual" = "$expected"
          test "$(stat -c%s tests/infdev-parity/reference/inf-20100327.jar)" -gt 500000

      - name: Discover original terrain generator class
        run: |
          python3 - <<'PY'
          import zipfile
          jar = "tests/infdev-parity/reference/inf-20100327.jar"
          needle = b"net/minecraft/a/a/c/a/c"
          with zipfile.ZipFile(jar) as z:
              for name in z.namelist():
                  if not name.endswith(".class"):
                      continue
                  data = z.read(name)
                  if needle in data:
                      print(name, "octavesRefs=", data.count(needle))
          PY

      - name: Analyze original terrain generator bytecode
        run: |
          python3 - <<'PY'
          import zipfile
          from collections import Counter
          jar = "tests/infdev-parity/reference/inf-20100327.jar"
          oct_ref = b"net/minecraft/a/a/c/a/c;"
          chunk_ref = b"net/minecraft/a/b/"
          rows = []
          with zipfile.ZipFile(jar) as z:
              for name in z.namelist():
                  if not name.endswith(".class"):
                      continue
                  data = z.read(name)
                  n = data.count(oct_ref)
                  if n:
                      rows.append((n, data.count(chunk_ref), name, len(data)))
          for row in sorted(rows, reverse=True)[:40]:
              print("octavesRefs=%d chunkRefs=%d size=%d %s" % (row[0], row[1], row[3], row[2]))
          PY

      - name: Inspect original noise and chunk provider mappings
        run: |
          javap -classpath tests/infdev-parity/reference/inf-20100327.jar -p -c net.minecraft.a.a.c.a 2>&1 | head -240 || true
          javap -classpath tests/infdev-parity/reference/inf-20100327.jar -p -c net.minecraft.a.a.c.a \
            > tests/infdev-parity/reference/provider.javap 2>&1 || true
          echo "Original provider density methods:"
          sed -n '487,760p' tests/infdev-parity/reference/provider.javap || true
          echo "Classes with Octaves descriptor:"
          python3 - <<'PY'
          import zipfile
          jar = "tests/infdev-parity/reference/inf-20100327.jar"
          ref = b"net/minecraft/a/a/c/a/c;"
          with zipfile.ZipFile(jar) as z:
              for name in z.namelist():
                  if name.endswith(".class"):
                      d=z.read(name)
                      if ref in d:
                          print(name, "count=", d.count(ref))
          PY

      - name: Compile original Java oracle
        run: |
          rm -rf tests/infdev-parity/reference/classes
          mkdir -p tests/infdev-parity/reference/classes
          javac -source 8 -target 8 \
            -d tests/infdev-parity/reference/classes \
            tests/infdev-parity/reference/Main.java \
            tests/infdev-parity/reference/net/minecraft/a/a/f.java \
            tests/infdev-parity/reference/net/minecraft/a/a/e/d.java

      - name: Compile C++ parity runner
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra \
            -Iminecraftpe/headers \
            tests/infdev-parity/infdev_parity.cpp \
            minecraftpe/impl/util/InfdevJavaRandom.cpp \
            minecraftpe/impl/util/InfdevNoisePerlin.cpp \
            minecraftpe/impl/util/InfdevNoiseOctaves.cpp \
            -o tests/infdev-parity/cpp-runner

      - name: Run original Java oracle
        run: |
          java -cp tests/infdev-parity/reference/classes Main \
            tests/infdev-parity/reference/inf-20100327.jar \
            tests/infdev-parity/reference/java.bin \
            > tests/infdev-parity/reference/java.out

      - name: Run C++ port
        run: |
          tests/infdev-parity/cpp-runner tests/infdev-parity/cpp.bin > tests/infdev-parity/cpp.out

      - name: Compare diagnostic streams
        run: |
          diff -u \
            tests/infdev-parity/reference/java.out \
            tests/infdev-parity/cpp.out

      - name: Compare raw oracle bytes
        run: |
          cmp -s tests/infdev-parity/reference/java.bin tests/infdev-parity/cpp.bin

      - name: Explain first raw mismatch
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          java_path=Path("tests/infdev-parity/reference/java.bin")
          cpp_path=Path("tests/infdev-parity/cpp.bin")
          if not java_path.exists() or not cpp_path.exists():
              print("One or both parity outputs do not exist; the producer step failed.")
              raise SystemExit(0)
          a=java_path.read_bytes()
          b=cpp_path.read_bytes()
          n=min(len(a),len(b))
          i=next((i for i in range(n) if a[i]!=b[i]),n)
          print(f"java.bin size={len(a)} cpp.bin size={len(b)}")
          if i<n:
              print(f"first raw mismatch at byte {i}: java=0x{a[i]:02x} cpp=0x{b[i]:02x}")
          elif len(a)!=len(b):
              print("All common bytes match; files have different lengths.")
          else:
              print("Raw files are identical.")
          PY

      - name: Publish parity artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: infdev-parity-failure
          path: tests/infdev-parity/
